<!DOCTYPE html>
<html>
<head>

    <title>Student Dashboard</title>

    <style>
        .logout-btn {
    background: #e63946;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.logout-btn:hover {
    background: #c92f3b;
}
        .notification-btn {
    position: relative;
    background: #1f2937;
    color: white;
    border: none;
    font-size: 22px;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.notification-count {
    position: absolute;
    top: -7px;
    right: -7px;
    background: #e63946;
    color: white;
    font-size: 12px;
    font-weight: bold;
    min-width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}
        .notification-wrapper {
    position: relative;
    margin-bottom: 30px;
}

.notification-btn {
    background: #1f2937;
    color: white;
    border: none;
    font-size: 22px;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.notification-panel {
    display: none;
    position: absolute;
    top: 55px;
    left: 0;
    width: 380px;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    z-index: 10;
}

.notification-panel h3 {
    margin-bottom: 15px;
}

.notification-card {
    background: #f8f9fa;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    border-left: 4px solid #e63946;
}
.notification-card.unread {
    background: #fff5f5;
    border-left: 5px solid #e63946;
    cursor: pointer;
}

.notification-card.read {
    background: #f8f9fa;
    border-left: 5px solid #ccc;
    opacity: 0.75;
}

.unread-label {
    color: #e63946;
    font-size: 12px;
    font-weight: bold;
    margin-left: 8px;
}

.notification-card p {
    margin-top: 7px;
}

.notification-time {
    color: #777;
    font-size: 12px;
    margin-top: 7px;
}

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        /* Navbar */

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        .profile {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .notification {
            font-size: 22px;
            cursor: pointer;
        }

        /* Main */

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }

        /* Notifications */

        .notifications {
            margin: 20px 0 30px 0;
        }

        .notification-card {
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            border-left: 5px solid #e63946;
        }

        .notification-card p {
            margin-top: 8px;
        }

        .notification-time {
            color: #777;
            font-size: 13px;
            margin-top: 8px;
        }

        /* Classes */

        .classes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .class-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .class-card h2 {
            margin-bottom: 15px;
        }

        .info {
            margin: 8px 0;
            color: #555;
        }

        .room {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            Smart Classroom Alert
        </div>

        <div class="profile">
    <span class="notification">🔔</span>
    <span>Yash</span>

    <button class="logout-btn" onclick="logout()">
        Logout
    </button>
</div>
    </nav>


    <!-- Main Content -->

    <main class="container">

        <div class="welcome">

            <h1>Good Morning, Yash 👋</h1>

            <p>Section: CSBS-T</p>

        </div>


        <!-- Notifications -->

        <div class="notification-wrapper">

    <button class="notification-btn" onclick="toggleNotifications()">
    🔔
    <span id="notificationCount" class="notification-count">0</span>
</button>

    <div id="notificationPanel" class="notification-panel">

        <h3>Notifications</h3>

        <div id="notifications">
            Loading notifications...
        </div>

    </div>

</div>

<br><br>


        <!-- Classes -->

        <h2>Today's Classes</h2>

        <br>

        <div class="classes" id="classes"></div>

    </main>


    <script>
        function logout() {

    fetch("/logout")
    .then(response => response.json())
    .then(data => {

        if (data.success) {
            window.location.href = data.redirect;
        }

    })
    .catch(error => {
        console.error(error);
    });
}
        function toggleNotifications() {

    const panel =
        document.getElementById("notificationPanel");

    if (panel.style.display === "block") {

        panel.style.display = "none";

    } else {

        panel.style.display = "block";

    }
}

        /* =========================
           LOAD CLASSES
        ========================= */

        fetch("/classes")

        .then(response => response.json())

        .then(data => {

            const container =
                document.getElementById("classes");

            container.innerHTML = "";

            data.forEach(classData => {

                const card =
                    document.createElement("div");

                card.className = "class-card";

                card.innerHTML = `

                    <h2>${classData.subject}</h2>

                    <p class="info">
                        🕐 ${classData.class_time}
                    </p>

                    <p class="info">
                        📚 ${classData.section}
                    </p>

                    <p class="room">
                        🏫 ${classData.room}
                    </p>

                `;

                container.appendChild(card);

            });

        })

        .catch(error => {

            console.error(error);

        });


        /* =========================
   LOAD NOTIFICATIONS
========================= */

fetch("/notifications")

.then(response => response.json())

.then(data => {

    const container =
        document.getElementById("notifications");

    const count =
        document.getElementById("notificationCount");

    container.innerHTML = "";

    // Count only unread notifications
    const unreadCount =
        data.filter(notification => !notification.is_read).length;

    count.innerText = unreadCount;

    // Hide badge when there are no unread notifications
    if (unreadCount === 0) {
        count.style.display = "none";
    } else {
        count.style.display = "flex";
    }

    if (data.length === 0) {

        container.innerHTML =
            "<p>No notifications.</p>";

        return;
    }

    data.forEach(notification => {

        const card =
            document.createElement("div");

        // Read / Unread class
        if (notification.is_read) {
            card.className = "notification-card read";
        } else {
            card.className = "notification-card unread";
        }

        card.innerHTML = `

            <strong>
                🔔 Classroom Update

                ${
                    !notification.is_read
                    ? '<span class="unread-label">NEW</span>'
                    : ''
                }

            </strong>

            <p>
                ${notification.message}
            </p>

            <div class="notification-time">
                ${notification.created_at}
            </div>

        `;

        // Mark notification as read when clicked
        card.onclick = function () {

            if (!notification.is_read) {

                fetch(
                    `/notifications/${notification.notification_id}/read`,
                    {
                        method: "POST"
                    }
                )
                .then(response => response.json())
                .then(result => {

                    if (result.success) {

                        notification.is_read = true;

                        card.className =
                            "notification-card read";

                        const label =
                            card.querySelector(".unread-label");

                        if (label) {
                            label.remove();
                        }

                        // Update unread count
                        const newUnreadCount =
                            data.filter(
                                n => !n.is_read
                            ).length;

                        count.innerText =
                            newUnreadCount;

                        if (newUnreadCount === 0) {
                            count.style.display = "none";
                        }
                    }

                });

            }

        };

        container.appendChild(card);

    });

})

.catch(error => {

    console.error(error);

    document.getElementById("notifications").innerHTML =
        "<p>Unable to load notifications.</p>";

});
    </script>

</body>

</html>
