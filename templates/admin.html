<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
        }
        .logo {
    font-size: 21px;
    font-weight: bold;
}

.subtitle {
    font-size: 12px;
    color: #d1d5db;
    margin-top: 4px;
}

.admin-profile {
    display: flex;
    align-items: center;
    gap: 20px;
}

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .class-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .change-btn {
            background: #1f2937;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .change-btn:hover {
            opacity: 0.85;
        }

        .form-box {
            margin-top: 20px;
            display: none;
        }

        select {
            padding: 10px;
            margin-right: 10px;
        }
    .admin-profile {
    display: flex;
    align-items: center;
    gap: 20px;
}

.logout-btn {
    background: #e63946;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

.logout-btn:hover {
    opacity: 0.85;
}
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin: 25px 0 30px;
}

.stat-card {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.stat-card h3 {
    color: #666;
    font-size: 14px;
    margin-bottom: 10px;
}

.stat-card p {
    font-size: 28px;
    font-weight: bold;
}

.status {
    font-size: 18px !important;
    color: #2e7d32;
}
.recent-section {
    margin-top: 40px;
}

.recent-section h2 {
    margin-bottom: 20px;
}

.change-history {
    background: white;
    padding: 18px 20px;
    margin-bottom: 12px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.07);
}

.change-history strong {
    font-size: 17px;
}

.room-change {
    margin-top: 8px;
    color: #555;
}

.change-time {
    margin-top: 8px;
    font-size: 12px;
    color: #888;
}
    </style>
</head>

<body>

    <div class="navbar">

    <div>
        <div class="logo">Smart Classroom Alert</div>
        <div class="subtitle">Classroom Management System</div>
    </div>

    <div class="admin-profile">
        <span>👨‍💼 Admin</span>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>
    </div>

</div>

    <div class="container">
        
<h1>Today's Classes</h1>

<div class="stats">

    <div class="stat-card">
        <h3>Total Classes</h3>
        <p id="totalClasses">0</p>
    </div>

    <div class="stat-card">
        <h3>Current Rooms</h3>
        <p id="totalRooms">0</p>
    </div>

    <div class="stat-card">
        <h3>System Status</h3>
        <p class="status">● Active</p>
    </div>

</div>

<div id="classes"></div>
        <div id="classes"></div>
        <div class="recent-section">

    <h2>Recent Room Changes</h2>

    <div id="recentChanges">
        Loading recent changes...
    </div>

</div>

    </div>


    <script>

    /* =========================
       LOAD CLASSES
    ========================= */

    fetch("/classes")
    .then(response => response.json())
    .then(data => {

        const container =
            document.getElementById("classes");

        const totalClasses =
            document.getElementById("totalClasses");

        const totalRooms =
            document.getElementById("totalRooms");

        // Total classes
        totalClasses.innerText = data.length;

        // Unique rooms
        const rooms = new Set(
            data.map(classData => classData.room)
        );

        totalRooms.innerText = rooms.size;

        container.innerHTML = "";

        data.forEach(classData => {

            const card =
                document.createElement("div");

            card.className = "class-card";

            card.innerHTML = `
                <h2>${classData.subject}</h2>

                <p>
                    Section: ${classData.section}
                </p>

                <p>
                    Time: ${classData.class_time}
                </p>

                <p>
                    Current Room:
                    <strong>${classData.room}</strong>
                </p>

                <button
                    class="change-btn"
                    onclick="showChangeForm(${classData.class_id})">
                    Change Room
                </button>

                <div
                    class="form-box"
                    id="form-${classData.class_id}">

                    <br>

                    <select id="room-${classData.class_id}">

                        <option value="Room 101">
                            Room 101
                        </option>

                        <option value="Room 204">
                            Room 204
                        </option>

                        <option value="Room 301">
                            Room 301
                        </option>

                        <option value="Seminar Hall">
                            Seminar Hall
                        </option>

                    </select>

                    <button
                        class="change-btn"
                        onclick="changeRoom(${classData.class_id})">
                        Update Room
                    </button>

                </div>
            `;

            container.appendChild(card);

        });

    })
    .catch(error => {
        console.error(error);
    });


    /* =========================
       SHOW CHANGE FORM
    ========================= */

    function showChangeForm(classId) {

        document.getElementById(
            "form-" + classId
        ).style.display = "block";

    }


    /* =========================
       CHANGE ROOM
    ========================= */

    function changeRoom(classId) {

        const newRoom =
            document.getElementById(
                "room-" + classId
            ).value;

        fetch("/change-room", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                class_id: classId,
                new_room: newRoom
            })

        })

        .then(response => response.json())

        .then(data => {

            alert(data.message);

            location.reload();

        });

    }


    /* =========================
       RECENT ROOM CHANGES
    ========================= */

    fetch("/recent-changes")
    .then(response => response.json())
    .then(data => {

        const container =
            document.getElementById("recentChanges");

        container.innerHTML = "";

        if (data.length === 0) {

            container.innerHTML =
                "<p>No room changes yet.</p>";

            return;
        }

        data.forEach(change => {

            const card =
                document.createElement("div");

            card.className = "change-history";

            card.innerHTML = `

                <strong>
                    ${change.subject}
                </strong>

                <div class="room-change">
                    🏫 ${change.old_room}
                    →
                    <strong>${change.new_room}</strong>
                </div>

                <div class="change-time">
                    🕐 ${change.changed_at}
                </div>

            `;

            container.appendChild(card);

        });

    })
    .catch(error => {

        console.error(error);

        document.getElementById("recentChanges").innerHTML =
            "<p>Unable to load recent changes.</p>";

    });


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

        fetch("/logout")
        .then(response => response.json())
        .then(data => {

            if (data.success) {
                window.location.href = data.redirect;
            }

        })
        .catch(error => {
            console.error(error);
        });

    }

</script>

</body>
</html>
